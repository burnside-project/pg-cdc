# Notify the docs site when docs content changes. On a push to main that touches docs/ or assets/,
# send a `repository_dispatch` (type: docs-updated) to the marketing-site repo, whose on-prem
# self-hosted "Publish documentation" runner rebuilds + republishes /docs (SHA-pinned to this commit).
# Without this, the docs site still catches changes on its hourly schedule — this just makes it instant.
#
# Requires a repo secret DOCS_DISPATCH_TOKEN: a fine-grained PAT (machine account) or GitHub App token
# scoped to dataalgebra-engineering/burnside-project-marketing-site with "Contents: Read and write"
# (the minimum that authorizes creating a repository_dispatch). If unset, this job is a no-op (the
# hourly schedule covers it) — pg-cdc CI never breaks on a missing secret.
name: Notify docs site

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - assets/**

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs-updated to the marketing-site repo
        env:
          DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "::warning::DOCS_DISPATCH_TOKEN not set — skipping dispatch. The docs site will pick up this change on its hourly schedule."
            exit 0
          fi
          # Payload is built with jq (never interpolated into the shell); sha/ref come from the GitHub
          # context (a commit hash + branch name), matching the receiver's { sha, ref } contract.
          payload="$(jq -nc --arg sha "$COMMIT_SHA" --arg ref "$REF_NAME" \
            '{event_type:"docs-updated", client_payload:{sha:$sha, ref:$ref}}')"
          curl -sSf -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dataalgebra-engineering/burnside-project-marketing-site/dispatches \
            -d "$payload"
          echo "dispatched docs-updated for pg-cdc@${COMMIT_SHA}"
